                        type: text
                        style: ''
                        detail: 0
                        format: 1
                        version: 1
                      - mode: normal
                        text: ' If traveling in spring, enjoy hanami—cherry blossom viewing—at some of Japan’s most picturesque spots, surrounded by a sea of pink petals.'
