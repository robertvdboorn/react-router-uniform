                        type: text
                        style: ''
                        detail: 0
                        format: 1
                        version: 1
                      - mode: normal
                        text: ' Delve into the world of Japanese sake with a guided tour and tasting at a local brewery, learning about the craftsmanship behind this iconic beverage.'
