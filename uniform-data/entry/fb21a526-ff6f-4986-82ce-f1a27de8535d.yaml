                        version: 1
                      - mode: normal
                        text: ' Begin your adventure with a multi-day trek to the legendary Matterhorn base camp, led by seasoned mountain guides. Traverse dramatic ridgelines, alpine meadows, and glacial valleys as you soak in panoramic views of the Swiss Alps.'
