                        type: text
                        style: ''
                        detail: 0
                        format: 1
                        version: 1
                      - mode: normal
                        text: ' Set sail on a private yacht as the sun dips below the horizon. Toast your love with champagne and savor the magic of Santorini’s world-famous sunsets from the water.'
