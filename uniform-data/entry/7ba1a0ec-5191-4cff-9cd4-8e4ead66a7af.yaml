                        detail: 0
                        format: 1
                        version: 1
                      - mode: normal
                        text: ' Dine at handpicked cliffside restaurants, where candlelit tables and panoramic views create the perfect setting for romance. Savor gourmet Greek cuisine and fine wines.'
