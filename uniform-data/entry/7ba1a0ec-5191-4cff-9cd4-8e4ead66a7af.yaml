                        style: ''
                        detail: 0
                        format: 1
                        version: 1
                      - mode: normal
                        text: ' Discover Santorini’s unique volcanic terroir with a guided wine tasting at renowned local vineyards. Sample exquisite wines and learn about the island’s ancient winemaking traditions.'
