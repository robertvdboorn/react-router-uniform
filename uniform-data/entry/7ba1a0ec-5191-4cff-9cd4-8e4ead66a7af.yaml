                        type: text
                        style: ''
                        detail: 0
                        format: 1
                        version: 1
                      - mode: normal
                        text: ' Spend six nights in a stunning cave suite perched on the caldera, offering breathtaking views of the Aegean Sea. Enjoy modern comforts, elegant décor, and the privacy you deserve.'
