$schema: https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
id: statItem
name: Stat Item
icon: screen
parameters:
  - id: number
    name: Number
    type: text
    guidance: The statistic number
  - id: label
    name: Label
    type: text
    guidance: Description label
    localizable: true
  - id: icon
    name: Icon
    type: select
    guidance: Select an icon to display
