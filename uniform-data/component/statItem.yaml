      options:
        - text: Globe
          value: globe
        - text: Map Pin
          value: map
        - text: Sparkles
          value: sparkles
        - text: Trophy
          value: trophy
        - text: Heart
          value: heart
        - text: Star
          value: star
        - text: Users
          value: users
        - text: Shield Check
          value: shield
        - text: Bolt
          value: bolt
        - text: Sun
          value: sun
        - text: Camera
          value: camera
        - text: Trending Up
          value: trending
      required: false
description: Individual statistic with number and label
useTeamPermissions: true
slots: []
titleParameter: number
canBeComposition: false
