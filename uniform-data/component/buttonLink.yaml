# yaml-language-server: $schema=https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
$schema: https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
id: buttonLink
name: Button Link
icon: screen
parameters:
  - id: text
    name: Text
    type: text
    guidance: Button label text
    typeConfig:
      required: false
    localizable: true
  - id: url
    name: URL
    type: link
    guidance: URL the button should link to
    typeConfig:
      required: false
  - id: variant
    name: Variant
    type: select
    guidance: Visual style of the button
    typeConfig:
      options:
        - text: Primary (Gradient)
          value: primary
        - text: Secondary (Gray)
          value: secondary
        - text: Outline
          value: outline
        - text: Ghost
          value: ghost
        - text: CTA Primary (White)
          value: cta-primary
        - text: CTA Secondary (Transparent)
          value: cta-secondary
      required: false
  - id: size
    name: Size
    type: select
    guidance: Button size
    typeConfig:
      options:
        - text: Small
          value: small
        - text: Medium
          value: medium
        - text: Large
          value: large
      required: false
description: A reusable button/link component with multiple variants and sizes
useTeamPermissions: true
slots: []
titleParameter: text
canBeComposition: false
created: '2025-12-10T14:15:22.134782+00:00'
updated: '2025-12-10T15:25:08.710427+00:00'
