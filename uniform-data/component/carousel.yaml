$schema: https://eu.uniform.app/schemas/json-schema/component-definition/v1.json
id: carousel
name: Carousel
icon: screen
parameters:
  - id: title
    name: Title
    type: text
    guidance: Carousel section title
    localizable: true
  - id: subtitle
    name: Subtitle
    type: text
    guidance: Carousel section subtitle
    localizable: true
  - id: autoplay
    name: Autoplay
    type: checkbox
