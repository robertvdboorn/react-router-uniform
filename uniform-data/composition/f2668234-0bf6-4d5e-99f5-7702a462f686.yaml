composition:
  _name: About Us
  _id: f2668234-0bf6-4d5e-99f5-7702a462f686
  type: page
  slots:
    content:
      - _id: 70c525d9-41fd-4b77-af79-1d5ddd8d9aca
        type: navigation
        _pattern: f571dde9-437b-4a48-ad69-97b253d6a815
      - _id: dce1b972-75ec-4993-8436-e7ff2551901d
        type: hero
        parameters:
          badge:
            type: text
            locales:
              en-US: Our Story
          title:
            type: text
            locales:
              en-US: Inspiring Travel Since 2009
          subtitle:
            type: text
            locales:
              en-US: >-
                Travel transforms lives. We're here to make unforgettable
                journeys possible for everyone, one adventure at a time.
      - _id: 6e927d1d-80ef-4470-ace2-295cde5eb387
        type: contentSection
        slots:
          content:
            - _id: 9ae30d31-1b8e-4694-b35f-814c70cfa64d
              type: textBlock
              parameters:
                content:
                  type: richText
                  locales:
                    en-US:
                      root:
                        type: root
                        format: ''
                        indent: 0
                        version: 1
                        children:
                          - type: paragraph
                            format: ''
                            indent: 0
                            version: 1
                            children:
                              - mode: normal
                                text: >-
                                  It started with a backpack and a dream. In
                                  2009, our founders quit their corporate jobs
                                  to explore the world. What they discovered
                                  wasn't just breathtaking destinations—it was
                                  the transformative power of travel.
                                type: text
                                style: ''
                                detail: 0
                                format: 0
                                version: 1
                            direction: null
                            textStyle: ''
                            textFormat: 0
                          - type: paragraph
                            format: ''
                            indent: 0
                            version: 1
                            children:
                              - mode: normal
                                text: >-
                                  After two years traveling through 45
                                  countries, they returned home with a mission:
                                  to make extraordinary travel experiences
                                  accessible to everyone. We partner with local
                                  communities worldwide to create authentic,
                                  sustainable journeys that change lives.
                                type: text
                                style: ''
                                detail: 0
                                format: 0
                                version: 1
                            direction: null
                            textStyle: ''
                            textFormat: 0
                          - type: paragraph
                            format: ''
                            indent: 0
                            version: 1
                            children:
                              - mode: normal
                                text: >-
                                  Today, we've helped over 50,000 travelers
                                  discover the world. But we're just getting
                                  started. Every journey we plan, every
                                  destination we explore, and every traveler we
                                  inspire brings us closer to our vision of a
                                  more connected, understanding world.
                                type: text
                                style: ''
                                detail: 0
                                format: 0
                                version: 1
                            direction: null
                            textStyle: ''
                            textFormat: 0
                        direction: null
            - _id: 872289e4-6f5c-4cb7-b949-e7c3b686dcf4
              type: featureGrid
              slots:
                features:
                  - _id: c8b10f7e-e508-4196-ac63-94671a4501b8
