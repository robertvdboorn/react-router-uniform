                      title:
                        type: text
                        locales:
                          en-US: Authentic Experiences
                      description:
                        type: text
                        locales:
                          en-US: >-
                            We partner with local guides and communities to
                            create genuine, immersive experiences that go beyond
                            typical tourism.
                  - _id: da8f3e5a-fa7a-4516-aa88-5fdf053add20
                    type: featureCard
                    parameters:
                      icon:
                        type: select
                        value: users
                      title:
                        type: text
                        locales:
                          en-US: Customer First
                      description:
                        type: text
                        locales:
                          en-US: >-
                            Enjoy peace of mind with our 24/7 support, ensuring
                            your dream vacation is seamless from start to
                            finish. We're always here to assist you, no matter
                            the time or place.
                  - _id: 2a22c3cd-1638-4322-be89-56b0beba02ef
                    type: featureCard
                    parameters:
                      icon:
                        type: select
                        value: heart
                      title:
                        type: text
                        locales:
                          en-US: Sustainable Travel
                      description:
                        type: text
                        locales:
                          en-US: >-
                            We are dedicated to responsible tourism practices
                            that safeguard the environment and empower local
                            communities, ensuring a positive impact for future
                            generations.
              parameters:
                title:
                  type: text
                  locales:
                    en-US: What Drives Us
                subtitle:
                  type: text
                  locales:
                    en-US: >-
                      Our core values guide everything we do, shaping our
                      approach and driving our commitment to excellence.
        parameters:
